[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3000
  framework = "#custom"

# 301 redirects from old NL paths to new Dutch paths
[[redirects]]
  from = "/services/development"
  to = "/diensten/softwareontwikkeling"
  status = 301

[[redirects]]
  from = "/services/branding-content"
  to = "/diensten/ai-workflows"
  status = 301

[[redirects]]
  from = "/services/performance-marketing"
  to = "/diensten/ai-workflows"
  status = 301

[[redirects]]
  from = "/services/*"
  to = "/diensten/:splat"
  status = 301

[[redirects]]
  from = "/cases"
  to = "/projecten"
  status = 301

[[redirects]]
  from = "/cases/*"
  to = "/projecten/:splat"
  status = 301

[[redirects]]
  from = "/about"
  to = "/over-ons"
  status = 301

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
